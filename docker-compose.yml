version: '3.9'
services:
  api:
    build: .
    container_name: fastapi_container
    command : uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis
  worker:
    build: .
    container_name: celery_worker
    command: celery -A app.worker.celery_worker.celery_app worker --loglevel=info --pool=solo
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"